{{- if .Values.stuck }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-stuck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-stuck
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-stuck
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["pause"]
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "exit 1"]
            periodSeconds: 1
{{- end }}
