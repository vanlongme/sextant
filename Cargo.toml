[workspace]
resolver = "2"
members = ["crates/sextant-core", "crates/sextant-app", "crates/sextant-fakekube"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
dashmap = "6"
sha2 = "0.11"
tempfile = "3"
tokio-util = "0.7"
ts-rs = { version = "12", features = ["serde-json-impl"] }
axum = "0.8"
kube = { version = "5.0", features = ["runtime", "ws", "oidc", "http-proxy", "socks5", "gzip"] }
k8s-openapi = { version = "0.29", features = ["v1_37"] }
