[workspace]
resolver = "2"
members = ["crates/skopos-core", "crates/skopos-app", "crates/skopos-fakekube"]

# Tauri and kube debug builds with full debuginfo exceed 20 GB. Line tables for our
# crates are enough for backtraces, and incremental caches add about 4 GB on top.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.3.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml_ng = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
regex = "1"
dashmap = "6"
sha2 = "0.11"
tempfile = "3"
tokio-util = "0.7"
ts-rs = { version = "12", features = ["serde-json-impl"] }
axum = "0.8"
kube = { version = "5.0", features = ["runtime", "ws", "oidc", "http-proxy", "socks5", "gzip"] }
k8s-openapi = { version = "0.29", features = ["v1_37"] }
