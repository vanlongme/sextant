# What the end-to-end specs browse. Everything lives in one test namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: skopos-test-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: skopos-test-e2e
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: skopos-test-e2e
data:
  mode: e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: skopos-test-e2e
type: Opaque
data:
  value: ZTJlLXNlY3JldA==
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: skopos-test-e2e
spec:
  selector:
    app: web
  ports:
    - port: 80
---
apiVersion: batch/v1
kind: Job
metadata:
  name: once
  namespace: skopos-test-e2e
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: registry.k8s.io/pause:3.10
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tick
  namespace: skopos-test-e2e
spec:
  # Suspended, so no pod appears in the middle of a spec that counts rows.
  suspend: true
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 0
          containers:
            - name: main
              image: registry.k8s.io/pause:3.10
