# The resource map's objects (spec E §18.3). e2e/helpers/fixtures.ts applies this
# before the app starts, after the Gateway API CRDs.
apiVersion: v1
kind: Namespace
metadata:
  name: skopos-e2e-map
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: skopos-e2e-map
spec:
  controllerName: example.com/skopos-e2e
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: skopos-e2e-map
spec:
  gatewayClassName: skopos-e2e-map
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: skopos-e2e-map
spec:
  parentRefs:
    - name: edge
  rules:
    - backendRefs:
        - name: web
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: skopos-e2e-map
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: skopos-e2e-map
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: skopos-e2e-map
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: skopos-e2e-map
data:
  mode: e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
  namespace: skopos-e2e-map
stringData:
  TOKEN: e2e-map-token
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-data
  namespace: skopos-e2e-map
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: skopos-e2e-map
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      serviceAccountName: web
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: registry.k8s.io/pause:3.10
          envFrom:
            - secretRef:
                name: web-secret
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: web-config
        - name: data
          persistentVolumeClaim:
            claimName: web-data
