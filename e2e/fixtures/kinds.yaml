apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: skopos-test-kinds
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: registry.k8s.io/pause:3.10
          env:
            - name: FROM_SECRET
              valueFrom:
                secretKeyRef: { name: creds, key: password }
          readinessProbe:
            tcpSocket: { port: 8080 }
            failureThreshold: 100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steady
  namespace: skopos-test-kinds
spec:
  replicas: 1
  selector:
    matchLabels: { app: steady }
  template:
    metadata:
      labels: { app: steady }
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: broken
  namespace: skopos-test-kinds
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: main
      image: registry.invalid/none:1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tick
  namespace: skopos-test-kinds
spec:
  schedule: "0 0 1 1 *"
  jobTemplate:
    metadata:
      labels: { team: a }
    spec:
      template:
        spec:
          terminationGracePeriodSeconds: 0
          restartPolicy: Never
          containers:
            - name: main
              image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: skopos-test-kinds
spec:
  type: ClusterIP
  selector: { app: api }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: skopos-test-kinds
spec:
  tls:
    - secretName: tls
  rules:
    - host: api.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 80 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: skopos-test-kinds
data:
  mode: fast
---
apiVersion: v1
kind: Secret
metadata:
  name: creds
  namespace: skopos-test-kinds
stringData:
  password: e2e-hidden-value
  user: admin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: skopos-test-kinds
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests: { storage: 1Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: robot
  namespace: skopos-test-kinds
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reader
  namespace: skopos-test-kinds
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader-robot
  namespace: skopos-test-kinds
subjects:
  - kind: ServiceAccount
    name: robot
    namespace: skopos-test-kinds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-robot
  namespace: skopos-test-kinds
subjects:
  - kind: ServiceAccount
    name: robot
    namespace: skopos-test-kinds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: small
  namespace: skopos-test-kinds
spec:
  hard:
    pods: "100"
