# Argo CD objects for e2e/specs/argocd.e2e.ts. No Argo CD controller runs, so each
# Application carries the status the controller would write. The Application CRD has
# no status subresource; the ApplicationSet status is patched by the spec.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: skopos-test-argocd
spec:
  sourceRepos: ["*"]
  destinations:
    - server: "*"
      namespace: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: restricted
  namespace: skopos-test-argocd
spec:
  sourceRepos: ["https://git.example.test/platform/*"]
  destinations:
    - server: https://kubernetes.default.svc
      namespace: edge
  syncWindows:
    - kind: allow
      schedule: "0 22 * * *"
      duration: 1h
      applications: ["*"]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: skopos-test-argocd
spec:
  project: default
  source:
    repoURL: https://git.example.test/apps.git
    path: guestbook
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
status:
  sync:
    status: Synced
    revision: 4f2c9a1d0b6e8f7a3c5d9e1b2a4c6e8f0a1b3c5d
  health:
    status: Healthy
  operationState:
    phase: Succeeded
    message: successfully synced (all tasks run)
    startedAt: "2026-11-01T10:00:00Z"
    finishedAt: "2026-11-01T10:00:30Z"
    operation:
      sync:
        revision: 4f2c9a1d0b6e8f7a3c5d9e1b2a4c6e8f0a1b3c5d
      initiatedBy:
        username: admin
  resources:
    - group: apps
      version: v1
      kind: Deployment
      namespace: guestbook
      name: guestbook-ui
      status: Synced
      health:
        status: Healthy
    - version: v1
      kind: Service
      namespace: guestbook
      name: guestbook-ui
      status: Synced
  history:
    - id: 1
      revision: 0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d
      deployedAt: "2026-10-30T10:00:00Z"
      source:
        repoURL: https://git.example.test/apps.git
        path: guestbook
        targetRevision: main
      initiatedBy:
        username: admin
    - id: 2
      revision: 9b07e3d2c4a6b8d0e2f4a6c8e0b2d4f6a8c0e2b4
      deployedAt: "2026-10-31T10:00:00Z"
      source:
        repoURL: https://git.example.test/apps.git
        path: guestbook
        targetRevision: main
      initiatedBy:
        automated: true
    - id: 3
      revision: 4f2c9a1d0b6e8f7a3c5d9e1b2a4c6e8f0a1b3c5d
      deployedAt: "2026-11-01T10:00:30Z"
      source:
        repoURL: https://git.example.test/apps.git
        path: guestbook
        targetRevision: main
      initiatedBy:
        username: admin
---
apiVersion: argoproj.io/v1alpha1
