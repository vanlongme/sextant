apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: teams
  namespace: skopos-test-argocd
spec:
  generators:
    - list:
        elements:
          - team: a
          - team: b
  template:
    metadata:
      name: "drop-{{team}}"
    spec:
      project: default
      source:
        repoURL: https://git.example.test/teams.git
        path: "teams/{{team}}"
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: "team-{{team}}"
