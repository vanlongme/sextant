---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: skopos-test-argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.example.test
      chart: redis
      targetRevision: 19.0.1
    - repoURL: https://git.example.test/values.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autopilot
  namespace: skopos-test-argocd
spec:
  project: default
  source:
    repoURL: https://git.example.test/apps.git
    path: autopilot
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: autopilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
status:
  sync:
    status: Synced
  health:
    status: Healthy
  history:
    - id: 1
      revision: 0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d
      deployedAt: "2026-10-30T10:00:00Z"
