name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: ""
          - os: macos-15
            args: "--target aarch64-apple-darwin"
          - os: macos-15
            args: "--target x86_64-apple-darwin"
          - os: windows-2022
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui build
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sextant ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }} --config crates/sextant-app/tauri.conf.json
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        run: |
          mount_point="$(mktemp -d)"
          hdiutil attach target/*/release/bundle/dmg/*.dmg -nobrowse -readonly -mountpoint "$mount_point"
          codesign --verify --deep --strict --verbose=2 "$mount_point/Sextant.app"
          codesign --display --verbose=2 "$mount_point/Sextant.app"
          hdiutil detach "$mount_point"
